services:
  scala-kudu-impala-kafka-spark:
    image : maven:3-eclipse-temurin-11
    volumes:
      - ..:/workspace:cached
    command: sleep infinity
    networks:
      - kudu-net

  kudu-master-1:
    image: apache/kudu:latest
    container_name: kudu-master-1
    ports:
      - "7051:7051"
      - "8051:8051"
    command: ["master"]
    deploy:
      resources:
        limits:
          memory: 300M
    networks:
      - kudu-net
    environment:
      - KUDU_MASTERS=kudu-master-1:7051,kudu-master-2:7051,kudu-master-3:7051
      - MASTER_ARGS=--rpc_authentication=disabled --rpc_bind_addresses=0.0.0.0:7051 --rpc_advertised_addresses=kudu-master-1:7051 --webserver_port=8051 --unlock_unsafe_flags=true

  kudu-master-2:
    image: apache/kudu:latest
    container_name: kudu-master-2
    ports:
      - "7052:7051"
      - "8052:8051"
    command: ["master"]
    deploy:
      resources:
        limits:
          memory: 300M
    networks:
      - kudu-net
    environment:
      - KUDU_MASTERS=kudu-master-1:7051,kudu-master-2:7051,kudu-master-3:7051
      - MASTER_ARGS=--rpc_authentication=disabled --rpc_bind_addresses=0.0.0.0:7051 --rpc_advertised_addresses=kudu-master-2:7051 --webserver_port=8051 --unlock_unsafe_flags=true

  kudu-master-3:
    image: apache/kudu:latest
    container_name: kudu-master-3
    ports:
      - "7053:7051"
      - "8053:8051"
    command: ["master"]
    deploy:
      resources:
        limits:
          memory: 300M
    networks:
      - kudu-net
    environment:
      - KUDU_MASTERS=kudu-master-1:7051,kudu-master-2:7051,kudu-master-3:7051
      - MASTER_ARGS=--rpc_authentication=disabled --rpc_bind_addresses=0.0.0.0:7051 --rpc_advertised_addresses=kudu-master-3:7051 --webserver_port=8051 --unlock_unsafe_flags=true

  kudu-tserver-1:
    image: apache/kudu:latest
    container_name: kudu-tserver-1
    depends_on:
      - kudu-master-1
      - kudu-master-2
      - kudu-master-3
    ports:
      - "7050:7050"
      - "8050:8050"
    command: ["tserver"]
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 600M
    networks:
      - kudu-net

    environment:
      - KUDU_MASTERS=kudu-master-1:7051,kudu-master-2:7051,kudu-master-3:7051
      - TSERVER_ARGS=--unlock_unsafe_flags=true

  trino:
    image: trinodb/trino:472
    container_name: trino
    depends_on:
      - hive-metastore
      - minio
      - kudu-master-1
      - kudu-master-2
      - kudu-master-3
    ports:
      - "8085:8080"
    networks:
      - kudu-net
    volumes:
      - ./trino/catalog:/etc/trino/catalog

  hive-metastore:
    image: apache/hive:4.0.0
    container_name: hive-metastore
    ports:
      - "9083:9083"
    environment:
      SERVICE_NAME: metastore
      AWS_ACCESS_KEY_ID: MpV3o8kVYR2d3Lp1gRPn
      AWS_SECRET_ACCESS_KEY: QELgEuFQGx9siULGCrnuTvi8D2cbqJHbnBT2owbw
      HADOOP_CLASSPATH: "/opt/hadoop/share/hadoop/tools/lib/*"
    volumes:
      - ./hive-site.xml:/opt/hive/conf/hive-site.xml
      - ./core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml
    networks:
      - kudu-net

  minio:
    image: airbyte/minio:RELEASE.2023-11-20T22-40-07Z
    container_name: minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password123

    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ./minio/data:/data
    networks:
      - kudu-net

volumes:
  minio-data:

networks:
  kudu-net:
    driver: bridge
